name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Assembla solo i file serviti dal sito. Il bundle JS di Bootstrap viene
      # copiato nello stesso percorso che usa index.html, così l'HTML non cambia.
      - name: Assemble site
        run: |
          mkdir -p _site/node_modules/bootstrap/dist/js
          cp index.html _site/
          cp -r dist _site/dist
          cp node_modules/bootstrap/dist/js/bootstrap.bundle.min.js _site/node_modules/bootstrap/dist/js/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
