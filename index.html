<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Game of Life: Twists and Turns' LifePod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="dist/css/main.css">
</head>
<body>
  <div id="app">
    <div id="start-screen" class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">
          <div class="card">
            <div class="card-body">
              <h1 class="h2 text-center text-primary mb-4">The Game of Life: Twists and Turns' LifePod</h1>

              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div class="input-group w-auto">
                  <label class="input-group-text" for="input-years">Years</label>
                  <input id="input-years" class="form-control" type="number" min="1" max="99" placeholder="15">
                </div>
                <button id="btn-house-rules" class="btn btn-outline-secondary" disabled>House rules</button>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="h5 mb-0">Players</h2>
                <button id="btn-add-player" class="btn btn-outline-primary">Add player</button>
              </div>
              <div id="players-list" class="d-flex flex-column gap-2"></div>
              <div id="menu-error" class="alert alert-danger d-none mt-3 mb-0" role="alert"></div>
            </div>
            <div class="card-footer bg-transparent border-0 d-grid gap-2 d-sm-flex justify-content-sm-center p-3 pt-0">
              <button id="btn-start" class="btn btn-primary btn-lg">Spin</button>
              <button id="btn-continue" class="btn btn-outline-secondary btn-lg" disabled>Continue game</button>
            </div>
          </div>
        </div>
      </div>
      <div id="start-screen-settings" class="position-fixed bottom-0 start-0 m-3"></div>
    </div>
    <div id="play-screen" class="d-none container-fluid min-vh-100 d-flex flex-column fs-5">
      <div class="row flex-grow-1 align-items-start">
        <div class="col-sm-3 d-flex flex-column align-items-center align-items-sm-stretch justify-content-start gap-2 p-2">
          <div class="d-flex align-items-center gap-2">
            <button id="btn-salary">Salary</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <input id="input-salary" type="text" inputmode="numeric" pattern="[0-9]*" class="d-none" aria-label="Salary input"><button id="btn-confirm-salary" aria-label="Confirm salary" class="d-none">✓</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button id="btn-chance">Chance</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button id="btn-auction">Business / Auction</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <input id="input-auction" type="text" inputmode="numeric" pattern="[0-9]*" class="d-none" aria-label="Auction input" placeholder="10000~100000"><button id="btn-confirm-auction" aria-label="Confirm auction" class="d-none">✓</button>
          </div>
          <!-- Lottery -->
        </div>
        <div class="col-sm-6 d-flex flex-column flex-sm-row flex-sm-wrap justify-content-center gap-2 p-2">
          <button id="btn-houses" data-bs-toggle="modal" data-bs-target="#houses-modal">Houses</button>
          <button id="btn-cars" data-bs-toggle="modal" data-bs-target="#cars-modal">Cars</button>
        </div>
        <div class="col-sm-3 d-flex justify-content-end p-2">
          <!-- Board spaces -->
        </div>
      </div>
      <div class="row sticky-top bg-body order-first order-sm-0 flex-grow-0 flex-sm-grow-1 align-items-center">
        <div class="col d-flex flex-column align-items-center p-2">
          <div id="player-name"></div>
          <div class="table-responsive">
            <table class="table">
              <thead id="player-scoreboard-header">
              <tr>
                <th scope="col">Rank</th>
                <th scope="col">Player</th>
                <th scope="col">Life Points</th>
              </tr>
              </thead>
              <tbody id="player-scoreboard">

              </tbody>
            </table>
          </div>
          <div class="d-flex align-items-center gap-2">
            <div id="player-money"></div>
            <button id="btn-add-money" aria-label="Add money">+</button>
            <button id="btn-remove-money" aria-label="Subtract money">−</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <input id="input-money" type="text" inputmode="numeric" pattern="[0-9]*" class="d-none" aria-label="Money input"><button id="btn-confirm-money" aria-label="Confirm operation" class="d-none">✓</button>
          </div>

          <div class="d-flex align-items-center gap-2">
            <div id="player-life-points"></div>
            <button id="btn-add-life-points" aria-label="Add life points">+</button>
            <button id="btn-remove-life-points" aria-label="Subtract life points">−</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <input id="input-life-points" type="text" inputmode="numeric" pattern="[0-9]*" class="d-none" aria-label="Life points input"><button id="btn-confirm-life-points" aria-label="Confirm operation" class="d-none">✓</button>
          </div>
          <div id="player-roll"></div>
          <div id="chance-result"></div>
          <button id="btn-spin">Spin</button>
        </div>
      </div>
      <div class="row flex-grow-1 align-items-end">
        <div id="cell-settings" class="col-6 col-sm-3 d-flex justify-content-start p-2">
          <!-- Volume -->
        </div>
        <div id="cell-life-learn-spin" class="col-12 col-sm-6 order-first order-sm-0 d-flex justify-content-center p-2">
          <button id="btn-wedding">Wedding</button>
          <button id="btn-kids" data-bs-toggle="modal" data-bs-target="#kids-modal">Kids</button>
          <!-- Kids and Degree/PhD -->
        </div>
        <div id="cell-years-end-turn" class="col-6 col-sm-3 d-flex flex-column align-items-end p-2">
          <div id="years-left">Years: </div>
          <button id="btn-end-turn">End turn</button>
        </div>
      </div>
    </div>
  </div>
  <button id="btn-fullscreen" class="btn btn-outline-secondary btn-sm m-1" aria-label="Enter fullscreen">↔</button>

  <div id="kids-modal" class="modal fade" tabindex="-1" aria-label="Kids">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body d-flex flex-column flex-sm-row justify-content-center gap-2">
          <button id="btn-1-kid" class="flex-sm-fill" data-bs-dismiss="modal">1 kid</button>
          <button id="btn-2-kids" class="flex-sm-fill" data-bs-dismiss="modal">2 kids</button>
          <button id="btn-try-kid" class="flex-sm-fill" data-bs-dismiss="modal">Try for a kid</button>
        </div>
      </div>
    </div>
  </div>

  <div id="houses-modal" class="modal fade" tabindex="-1" aria-label="Houses">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body d-flex flex-column flex-sm-row justify-content-center gap-2">
          <button id="btn-house-small" class="flex-sm-fill" data-bs-dismiss="modal">Modest House</button>
          <button id="btn-house-medium" class="flex-sm-fill" data-bs-dismiss="modal">Mid-sized House</button>
          <button id="btn-house-large" class="flex-sm-fill" data-bs-dismiss="modal">Mansion</button>
        </div>
      </div>
    </div>
  </div>

  <div id="cars-modal" class="modal fade" tabindex="-1" aria-label="Cars">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body d-flex flex-column flex-sm-row justify-content-center gap-2">
          <button id="btn-car-economy" class="flex-sm-fill" data-bs-dismiss="modal">Economy Car</button>
          <button id="btn-car-luxury" class="flex-sm-fill" data-bs-dismiss="modal">Luxury Car</button>
        </div>
      </div>
    </div>
  </div>

  <div id="color-picker-template" class="d-none">
    <input type="radio" name="player-color-x" class="red color-picker-circle" id="red-color-picker-x" data-color="Red" aria-label="Red">
    <input type="radio" name="player-color-x" class="blue color-picker-circle" id="blue-color-picker-x" data-color="Blue" aria-label="Blue">
    <input type="radio" name="player-color-x" class="green color-picker-circle" id="green-color-picker-x" data-color="Green" aria-label="Green">
    <input type="radio" name="player-color-x" class="yellow color-picker-circle" id="yellow-color-picker-x" data-color="Yellow" aria-label="Yellow">
    <input type="radio" name="player-color-x" class="magenta color-picker-circle" id="magenta-color-picker-x" data-color="Magenta" aria-label="Magenta">
    <input type="radio" name="player-color-x" class="black color-picker-circle" id="black-color-picker-x" data-color="Black" aria-label="Black">
  </div>

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="dist/index.js"></script>
</body>
</html>
