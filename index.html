<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Game of Life: Twists and Turns' LifePod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="dist/css/main.css">
</head>
<body>
  <div id="app">
    <div id="start-screen" class="container py-4 py-md-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">
          <div class="card">
            <div class="card-body">
              <h1 class="h2 text-center text-primary mb-4">The Game of Life: Twists and Turns' LifePod</h1>

              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div class="input-group w-auto">
                  <label class="input-group-text" for="input-years">Years</label>
                  <input id="input-years" class="form-control" type="number" min="1" max="99" placeholder="15">
                </div>
                <button id="btn-house-rules" class="btn btn-outline-secondary" disabled><i class="bi bi-sliders me-2" aria-hidden="true"></i>House rules</button>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="h5 mb-0">Players</h2>
                <button id="btn-add-player" class="btn btn-outline-primary"><i class="bi bi-person-plus-fill me-2" aria-hidden="true"></i>Add player</button>
              </div>
              <div id="players-list" class="d-flex flex-column gap-2"></div>
              <div id="menu-error" class="alert alert-danger d-none mt-3 mb-0" role="alert"></div>
            </div>
            <div class="card-footer bg-transparent border-0 d-grid gap-2 d-sm-flex justify-content-sm-center p-3 pt-0">
              <button id="btn-start" class="btn btn-primary btn-lg"><i class="bi bi-play-fill me-2" aria-hidden="true"></i>Spin</button>
              <button id="btn-continue" class="btn btn-outline-secondary btn-lg" disabled><i class="bi bi-arrow-clockwise me-2" aria-hidden="true"></i>Continue game</button>
            </div>
          </div>
        </div>
      </div>
      <div id="start-screen-settings" class="position-fixed bottom-0 start-0 d-flex align-items-center gap-2 m-3"></div>
    </div>
    <div id="play-screen" class="d-none container-fluid min-vh-100 d-flex flex-column fs-5">
      <div class="row flex-grow-1 align-items-start">
        <div class="col-sm-3 d-flex flex-column align-items-center align-items-sm-stretch justify-content-start gap-2 p-2">
          <div class="d-flex align-items-center gap-2">
            <button id="btn-salary" class="btn btn-outline-primary"><i class="bi bi-briefcase-fill me-2" aria-hidden="true"></i>Salary</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <input id="input-salary" type="text" inputmode="numeric" pattern="[0-9]*" class="form-control w-auto d-none" aria-label="Salary input"><button id="btn-confirm-salary" aria-label="Confirm salary" class="btn btn-primary btn-icon d-none"><i class="bi bi-check-lg" aria-hidden="true"></i></button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button id="btn-chance" class="btn btn-outline-primary"><i class="bi bi-question-circle-fill me-2" aria-hidden="true"></i>Chance</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button id="btn-auction" class="btn btn-outline-primary"><i class="bi bi-currency-exchange me-2" aria-hidden="true"></i>Business / Auction</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <input id="input-auction" type="text" inputmode="numeric" pattern="[0-9]*" class="form-control w-auto d-none" aria-label="Auction input" placeholder="10000~100000"><button id="btn-confirm-auction" aria-label="Confirm auction" class="btn btn-primary btn-icon d-none"><i class="bi bi-check-lg" aria-hidden="true"></i></button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button id="btn-lottery" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#lottery-modal"><i class="bi bi-ticket-perforated-fill me-2" aria-hidden="true"></i>Lottery</button>
          </div>
        </div>
        <div class="col-sm-6 d-flex flex-column flex-sm-row flex-sm-wrap justify-content-center align-items-center align-items-sm-stretch gap-2 p-2">
          <button id="btn-houses" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#houses-modal"><i class="bi bi-house-door-fill me-2" aria-hidden="true"></i>Houses</button>
          <button id="btn-cars" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#cars-modal"><i class="bi bi-car-front-fill me-2" aria-hidden="true"></i>Cars</button>
        </div>
        <div class="col-sm-3 d-flex justify-content-end p-2">
          <!-- Board spaces -->
        </div>
      </div>
      <div class="row sticky-top bg-body order-first order-sm-0 flex-grow-0 flex-sm-grow-1 align-items-center">
        <div class="col position-relative d-flex flex-column align-items-center p-2">
          <div id="toast-container-portrait" class="toast-stack d-sm-none position-absolute top-100 start-50 translate-middle-x p-3" aria-live="polite" aria-atomic="true"></div>
          <div id="toast-container-landscape" class="toast-stack d-none d-sm-block position-absolute bottom-100 start-50 translate-middle-x p-3" aria-live="polite" aria-atomic="true"></div>
          <div id="player-name" class="h4 mb-1 fw-semibold"></div>
          <div id="play-error" class="alert alert-danger d-none mb-2" role="alert"></div>
          <div class="table-responsive">
            <table class="table table-borderless">
              <thead id="player-scoreboard-header">
              <tr>
                <th scope="col">Rank</th>
                <th scope="col">Player</th>
                <th scope="col">Life Points</th>
              </tr>
              </thead>
              <tbody id="player-scoreboard">

              </tbody>
            </table>
          </div>
          <div class="d-flex flex-column flex-sm-row flex-sm-wrap justify-content-center align-items-center align-items-sm-start gap-3 gap-sm-4">
            <div class="d-flex flex-column align-items-center">
              <div class="d-flex align-items-center gap-2">
                <button id="btn-remove-money" class="btn btn-outline-secondary btn-icon" aria-label="Subtract money"><i class="bi bi-dash-lg" aria-hidden="true"></i></button>
                <div class="d-flex flex-column align-items-center">
                  <div id="player-money" class="stat-value"></div>
                  <div id="player-money-label" class="stat-label">Money</div>
                </div>
                <button id="btn-add-money" class="btn btn-outline-secondary btn-icon" aria-label="Add money"><i class="bi bi-plus-lg" aria-hidden="true"></i></button>
              </div>
              <div class="d-flex align-items-center gap-2 mt-1">
                <input id="input-money" type="text" inputmode="numeric" pattern="[0-9]*" class="form-control w-auto d-none" aria-label="Money input"><button id="btn-confirm-money" aria-label="Confirm operation" class="btn btn-primary btn-icon d-none"><i class="bi bi-check-lg" aria-hidden="true"></i></button>
              </div>
            </div>

            <div class="d-flex flex-column align-items-center">
              <div class="d-flex align-items-center gap-2">
                <button id="btn-remove-life-points" class="btn btn-outline-secondary btn-icon" aria-label="Subtract life points"><i class="bi bi-dash-lg" aria-hidden="true"></i></button>
                <div class="d-flex flex-column align-items-center">
                  <div id="player-life-points" class="stat-value"></div>
                  <div id="player-life-points-label" class="stat-label">Life Points</div>
                </div>
                <button id="btn-add-life-points" class="btn btn-outline-secondary btn-icon" aria-label="Add life points"><i class="bi bi-plus-lg" aria-hidden="true"></i></button>
              </div>
              <div class="d-flex align-items-center gap-2 mt-1">
                <input id="input-life-points" type="text" inputmode="numeric" pattern="[0-9]*" class="form-control w-auto d-none" aria-label="Life points input"><button id="btn-confirm-life-points" aria-label="Confirm operation" class="btn btn-primary btn-icon d-none"><i class="bi bi-check-lg" aria-hidden="true"></i></button>
              </div>
            </div>
          </div>
          <div class="d-flex align-items-center gap-3 mt-2">
            <div id="player-roll" class="d-flex flex-column align-items-center p-2">Rolled<div id="player-roll-number" class="roll-number border rounded-circle d-flex align-items-center justify-content-center green p-2"></div></div>
            <div id="chance-result" class="d-flex flex-column align-items-center p-2">Chance<div id="chance-result-number" class="roll-number border rounded-circle d-flex align-items-center justify-content-center green p-2"></div></div>
          </div>
          <button id="btn-spin" class="btn btn-primary btn-spin rounded-circle mt-2">Spin</button>
        </div>
      </div>
      <div class="row flex-grow-1 align-items-end">
        <div id="cell-settings" class="col-6 col-sm-3 d-flex align-items-center gap-2 justify-content-start p-2"></div>
        <div id="cell-life-learn-spin" class="col-12 col-sm-6 order-first order-sm-0 d-flex justify-content-center gap-2 p-2">
          <button id="btn-wedding" class="btn btn-outline-primary"><i class="bi bi-heart-fill me-2" aria-hidden="true"></i><span id="btn-wedding-label">Wedding</span></button>
          <button id="btn-kids" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#kids-modal"><i class="bi bi-people-fill me-2" aria-hidden="true"></i><span id="btn-kids-label">Kids</span></button>
          <!-- Degree/PhD -->
        </div>
        <div id="cell-years-end-turn" class="col-6 col-sm-3 d-flex flex-column align-items-end gap-2 p-2">
          <button id="btn-years-left" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" aria-label="Years left. Press and hold to change">
            <i class="bi bi-arrow-repeat" aria-hidden="true"></i><span id="years-left-value"></span>
          </button>
          <div class="d-flex align-items-center gap-2">
            <input id="input-years-left" type="text" inputmode="numeric" pattern="[0-9]*" class="form-control w-auto d-none" aria-label="Years left input"><button id="btn-confirm-years-left" aria-label="Confirm years left" class="btn btn-primary btn-icon d-none"><i class="bi bi-check-lg" aria-hidden="true"></i></button>
          </div>
          <button id="btn-end-turn" class="btn btn-primary"><i class="bi bi-arrow-right-circle-fill me-2" aria-hidden="true"></i>End turn</button>
        </div>
      </div>
    </div>
  </div>
  <button id="btn-fullscreen" class="btn btn-outline-secondary btn-icon m-1" aria-label="Enter fullscreen"><i id="icon-fullscreen" class="bi bi-arrows-fullscreen" aria-hidden="true"></i></button>
  <div id="volume-control" class="d-flex align-items-center gap-2 m-1">
    <i class="bi bi-volume-up-fill" aria-hidden="true"></i>
    <input id="input-volume" type="range" min="0" max="1" value="0.4" step="0.01" class="form-range" aria-label="Volume">
  </div>

  <div id="kids-modal" class="modal fade" tabindex="-1" aria-label="Kids">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body d-flex flex-column flex-sm-row justify-content-center gap-2">
          <button id="btn-1-kid" class="btn btn-outline-primary flex-sm-fill" data-bs-dismiss="modal"><i class="bi bi-person-fill me-2" aria-hidden="true"></i>1 kid</button>
          <button id="btn-2-kids" class="btn btn-outline-primary flex-sm-fill" data-bs-dismiss="modal"><i class="bi bi-people-fill me-2" aria-hidden="true"></i>2 kids</button>
          <button id="btn-try-kid" class="btn btn-outline-primary flex-sm-fill" data-bs-dismiss="modal"><i class="bi bi-question-circle-fill me-2" aria-hidden="true"></i>Try for a kid</button>
        </div>
      </div>
    </div>
  </div>

  <div id="lottery-modal" class="modal fade" tabindex="-1" aria-label="Lottery">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body d-flex flex-column align-items-center gap-3">
          <div class="d-flex flex-column align-items-center">
            <div id="lottery-pot" class="stat-value"></div>
            <div class="stat-label">Pot</div>
          </div>
          <div id="lottery-player-list" class="d-flex flex-column align-items-stretch gap-2 w-100"></div>
          <button id="btn-lottery-spin" class="btn btn-primary d-flex align-items-center"><i class="bi bi-ticket-perforated-fill me-2" aria-hidden="true"></i>Spin</button>
        </div>
      </div>
    </div>
  </div>

  <div id="houses-modal" class="modal fade" tabindex="-1" aria-label="Houses">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body d-flex flex-column flex-sm-row justify-content-center gap-2">
          <button id="btn-house-small" class="btn btn-outline-primary flex-sm-fill" data-bs-dismiss="modal">Modest House</button>
          <button id="btn-house-medium" class="btn btn-outline-primary flex-sm-fill" data-bs-dismiss="modal">Mid-sized House</button>
          <button id="btn-house-large" class="btn btn-outline-primary flex-sm-fill" data-bs-dismiss="modal">Mansion</button>
        </div>
      </div>
    </div>
  </div>

  <div id="cars-modal" class="modal fade" tabindex="-1" aria-label="Cars">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body d-flex flex-column flex-sm-row justify-content-center gap-2">
          <button id="btn-car-economy" class="btn btn-outline-primary flex-sm-fill" data-bs-dismiss="modal">Economy Car</button>
          <button id="btn-car-luxury" class="btn btn-outline-primary flex-sm-fill" data-bs-dismiss="modal">Luxury Car</button>
        </div>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal fade" tabindex="-1" aria-label="Confirm">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">
          <p id="confirm-message" class="text-center"></p>
          <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
            <button id="btn-confirm-cancel" class="btn btn-outline-secondary flex-sm-fill" data-bs-dismiss="modal">Cancel</button>
            <button id="btn-confirm-ok" class="btn btn-primary flex-sm-fill" data-bs-dismiss="modal">Confirm</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="roll-modal" class="modal fade fs-2" tabindex="-1" aria-label="Roll">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body d-flex flex-column align-items-center gap-2">
          <div id="roll-pot-wrapper" class="d-flex flex-column align-items-center d-none">
            <div id="roll-pot" class="stat-value"></div>
            <div class="stat-label">Pot</div>
          </div>
          <div class="roll-circle mx-auto">
            <div id="roll-number-0" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">0</div>
            <div id="roll-number-1" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">1</div>
            <div id="roll-number-2" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">2</div>
            <div id="roll-number-3" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">3</div>
            <div id="roll-number-4" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">4</div>
            <div id="roll-number-5" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">5</div>
            <div id="roll-number-6" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">6</div>
            <div id="roll-number-7" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">7</div>
            <div id="roll-number-8" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">8</div>
            <div id="roll-number-9" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">9</div>
            <div id="roll-number-10" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">10</div>
            <div id="roll-number-11" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">11</div>
            <div id="roll-number-12" class="roll-number border rounded-circle d-flex align-items-center justify-content-center">12</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="color-picker-template" class="d-none">
    <input type="radio" name="player-color-x" class="red color-picker-circle" id="red-color-picker-x" data-color="Red" aria-label="Red">
    <input type="radio" name="player-color-x" class="blue color-picker-circle" id="blue-color-picker-x" data-color="Blue" aria-label="Blue">
    <input type="radio" name="player-color-x" class="green color-picker-circle" id="green-color-picker-x" data-color="Green" aria-label="Green">
    <input type="radio" name="player-color-x" class="yellow color-picker-circle" id="yellow-color-picker-x" data-color="Yellow" aria-label="Yellow">
    <input type="radio" name="player-color-x" class="magenta color-picker-circle" id="magenta-color-picker-x" data-color="Magenta" aria-label="Magenta">
    <input type="radio" name="player-color-x" class="black color-picker-circle" id="black-color-picker-x" data-color="Black" aria-label="Black">
  </div>

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="dist/index.js"></script>
</body>
</html>
