<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital LifePod</title>
  <link rel="stylesheet" href="dist/css/main.css">
</head>
<body>
  <div id="app">
    <div id="start-screen">
      <label>
        Years <input id="input-years" type="number" min="1" max="99" placeholder="15">
      </label>
      <button id="btn-start">Spin</button> or <button id="btn-continue" disabled>Continue game</button>
      <br/>
      <button id="btn-add-player">Add player</button>
      <button id="btn-house-rules" disabled>House rules</button>
      <div id="players-list">

      </div>
    </div>
    <div id="play-screen" class="d-none container-fluid min-vh-100 d-flex flex-column">
      <div class="row flex-grow-1 align-items-start">
        <div class="col d-flex justify-content-start m-4">
          <!-- Lottery, Salary e Business / Auction, Chance -->
        </div>
        <div class="col d-flex justify-content-center m-4">
          <!-- Houses and cars -->
        </div>
        <div class="col d-flex justify-content-end m-4">
          <!-- Board spaces -->
        </div>
      </div>
      <div class="row flex-grow-1 align-items-center">
        <div class="col d-flex flex-column align-items-center m-4">
          <div id="player-name"></div>
          <div class="d-flex align-items-center gap-2">
            <div id="player-money"></div>
            <button id="btn-add-money" aria-label="Add money">+</button>
            <button id="btn-remove-money" aria-label="Subtract money">−</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <input id="input-money" type="text" inputmode="numeric" pattern="[0-9]*" class="d-none" aria-label="Money input"><button id="btn-confirm-money" aria-label="Confirm operation" class="d-none">✓</button>
          </div>

          <div class="d-flex align-items-center gap-2">
            <div id="player-life-points"></div>
            <button id="btn-add-life-points" aria-label="Add life points">+</button>
            <button id="btn-remove-life-points" aria-label="Subtract life points">−</button>
          </div>
          <div class="d-flex align-items-center gap-2">
            <input id="input-life-points" type="text" inputmode="numeric" pattern="[0-9]*" class="d-none" aria-label="Life points input"><button id="btn-confirm-life-points" aria-label="Confirm operation" class="d-none">✓</button>
          </div>
        </div>
      </div>
      <div class="row flex-grow-1 align-items-end">
        <div id="cell-settings" class="col d-flex justify-content-start m-4">
          <!-- Volume -->
        </div>
        <div id="cell-life-learn-spin" class="col d-flex justify-content-center m-4">
          <!-- Wedding, Kids and Degree/PhD -->
          <button id="btn-spin">Spin</button>
        </div>
        <div id="cell-years-end-turn" class="col d-flex flex-column align-items-end m-4">
          <div id="years-left">Years: </div>
          <button id="btn-end-turn">End turn</button>
        </div>
      </div>
    </div>
  </div>
  <button id="btn-fullscreen" aria-label="Enter fullscreen">↔</button>

  <div id="color-picker-template" style="display: none">
    <input type="radio" name="player-color-x" class="red color-picker-circle" id="red-color-picker-x" data-color="Red" aria-label="Red">
    <input type="radio" name="player-color-x" class="blue color-picker-circle" id="blue-color-picker-x" data-color="Blue" aria-label="Blue">
    <input type="radio" name="player-color-x" class="green color-picker-circle" id="green-color-picker-x" data-color="Green" aria-label="Green">
    <input type="radio" name="player-color-x" class="yellow color-picker-circle" id="yellow-color-picker-x" data-color="Yellow" aria-label="Yellow">
    <input type="radio" name="player-color-x" class="magenta color-picker-circle" id="magenta-color-picker-x" data-color="Magenta" aria-label="Magenta">
    <input type="radio" name="player-color-x" class="black color-picker-circle" id="black-color-picker-x" data-color="Black" aria-label="Black">
  </div>

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="dist/index.js"></script>
</body>
</html>
